# ============================================================
# 2. 国内“大全”主规则
# ChinaMax 已包含大量国内 App、CDN、运营商、银行、视频、购物、生活服务等：
# 微信/腾讯、抖音/字节、B站、淘宝/支付宝、京东、拼多多、美团、
# 小红书、快手、百度、网易、知乎、滴滴、钉钉、12306、
# 华为/小米/OPPO/vivo、移动/联通/电信、各大银行、国内 CDN 等。
# 仓库官方建议 ChinaMax.list + ChinaMax_Domain.list 共同使用，
# 且不要再重复引用一堆国内子规则。
# ============================================================
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/ChinaMax/ChinaMax.list,DIRECT
DOMAIN-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/ChinaMax/ChinaMax_Domain.list,DIRECT

# 常规兜底：.cn 与中国大陆 IP 直连
DOMAIN-SUFFIX,cn,DIRECT
GEOIP,CN,DIRECT

# ============================================================
# 3. 最终兜底
# 所有没被识别为国内的流量，一律走首页当前选中的住宅 IP。
# ============================================================
FINAL,PROXY


[Host]
localhost = 127.0.0.1
