name: Classify Shadowrocket Config

on:
  push:
    paths:
      - '花花最终版.conf'
      - 'tools/analyze_config.py'
      - '.github/workflows/classify.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Analyze config
        run: python tools/analyze_config.py

      - name: Commit generated reports
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- classified)" ]; then
            echo "No report changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add classified
          git commit -m "chore: update config classification report"
          git push
